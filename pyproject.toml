[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rawfetch"
version = "0.3.0"
description = "Grab verbatim text from sources your AI can't reach — one command, zero LLM."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{name = "yap-builder"}]
keywords = ["youtube", "reddit", "transcript", "captions", "scraping", "verbatim", "cli", "agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing",
    "Topic :: Utilities",
]
dependencies = [
    "youtube-transcript-api>=1.2,<2",
    "trafilatura==2.0.0",
    "lxml-html-clean==0.4.5",
    "requests>=2.31",
]

[project.optional-dependencies]
# Reddit needs a real browser engine: `pip install 'rawfetch[reddit]'`, then
# `playwright install webkit` (~300 MB download). Kept optional so YouTube/web stay light.
reddit = ["playwright>=1.40,<2"]

[project.urls]
Homepage = "https://github.com/yap-builder/rawfetch"
Source = "https://github.com/yap-builder/rawfetch"
Issues = "https://github.com/yap-builder/rawfetch/issues"

[project.scripts]
rawfetch = "rawfetch.cli:main"

[tool.setuptools]
packages = ["rawfetch"]
